spring.application.name=matrimonial-platform

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/matrimonial_platform?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.sql.init.mode=never

server.port=${SERVER_PORT:8080}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
app.jwt.secret=${APP_JWT_SECRET:please-change-this-development-secret-key-for-matrimonial-platform}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

springdoc.swagger-ui.path=/swagger-ui.html
